<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2f70"/>
      <stop offset=".6" stop-color="#241d4d"/>
      <stop offset="1" stop-color="#151038"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Rays: the sun arriving in the dark. -->
  <g id="rays" fill="#eba60c">
    <rect x="246" y="60" width="20" height="56" rx="10"/>
    <rect x="246" y="396" width="20" height="56" rx="10"/>
    <rect x="60" y="246" width="56" height="20" rx="10"/>
    <rect x="396" y="246" width="56" height="20" rx="10"/>
  </g>
  <use href="#rays" transform="rotate(45 256 256)"/>

  <!-- The sun, carrying the current. -->
  <circle cx="256" cy="256" r="98" fill="#f7c034"/>
  <path d="M274 196l-58 84h38l-12 56 58-84h-38z" fill="#241d4d"/>
</svg>
